<button
    [ngClass]="{
        'buttonatom': true,
        'buttonatom-light': theme == 'light',
        'buttonatom-warning': theme == 'warning',
    }"
    (click)="clickButton()" [disabled]="isLoading">
    @if(isLoading){
    <span class="buttonatom__spinner" aria-hidden="true"></span>
    }
    {{ name }}
</button>
